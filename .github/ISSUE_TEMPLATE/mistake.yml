name: Report a mistake
description: Something in the handbook is wrong, out of date or missing a detail.
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address or title, and the tag or section if there is one.
      placeholder: init/animal, tag SPEED
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What the handbook says
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happens
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A vanilla file from base/data.zip, a mod that shows the behaviour, or what you saw in game. The more exact, the faster it can be checked.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: v0.71.44
    validations:
      required: true
